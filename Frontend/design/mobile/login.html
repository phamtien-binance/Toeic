<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sinh viên · Đăng nhập</title>
<link rel="stylesheet" href="../shared.css">
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="statusbar"><span>9:41</span><span class="right">▮▮▮ ⌁ ▰</span></div>
    <div class="app" style="background:#fff">
      <div style="padding:26px 24px 0">
        <div class="brand-mark" style="width:52px;height:52px;border-radius:16px;font-size:15px">TR</div>
        <h2 style="font-size:26px;letter-spacing:-.8px;margin:26px 0 8px">Chào mừng trở lại</h2>
        <p style="color:var(--muted);margin:0 0 26px;font-size:13.5px">Đăng nhập để vào phòng thi Reading của bạn.</p>
        <div class="stack">
          <div class="field"><label>Mã số sinh viên</label><input class="input" value="2380614025" style="height:48px"></div>
          <div class="field"><label>Mật khẩu</label><input class="input" type="password" value="••••••••" style="height:48px"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)">
            <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" checked> Ghi nhớ</label>
            <a href="#" style="color:var(--blue-700);font-weight:600">Quên mật khẩu?</a>
          </div>
          <a class="btn btn-primary btn-block" href="exams.html" style="height:50px;font-size:14.5px">Đăng nhập</a>
        </div>
        <div class="divider">hoặc</div>
        <a class="btn btn-block" href="exams.html" style="height:48px">Đăng nhập bằng tài khoản trường</a>
      </div>
      <div style="margin-top:auto;padding:22px 24px 28px;text-align:center;font-size:11.5px;color:var(--muted)">
        Bằng việc đăng nhập, bạn đồng ý với <b style="color:var(--blue-700)">Nội quy phòng thi</b> của nhà trường.
      </div>
    </div>
    <div class="tabbar" style="border-top:0;height:22px;flex:0 0 22px"><div style="width:120px;height:5px;border-radius:99px;background:#D7DFEC;margin:0 auto 8px"></div></div>
  </div>
</div>
</body>
</html>
